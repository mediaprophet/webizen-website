[package]
name = "webizen-world-host"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
qualia-core-db = { path = "C:/github/qualiaDB/crates/qualia-core-db", default-features = false, features = ["portal"] }
vibe = { path = "C:/github/qualiaDB/crates/vibe" }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3.106"
web-sys = { version = "0.3.106", features = ["Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "HtmlSelectElement", "HtmlInputElement", "HtmlAnchorElement", "Node", "Event", "EventTarget", "PointerEvent", "WheelEvent", "KeyboardEvent", "DomRect", "Response", "Request", "RequestInit", "RequestMode", "Performance", "MediaQueryList", "console"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[patch.crates-io]
imap-proto = { path = "C:/github/qualiaDB/vendor/imap-proto" }

[patch."https://github.com/mediaprophet/vibe-script.git"]
vibescript-abi = { path = "C:/github/qualiaDB/crates/vibescript-abi" }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
