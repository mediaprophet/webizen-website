<!doctype html><html lang="en-AU"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Native QualiaPortal — Synth terrain</title><style>body{margin:0;background:#173a31;color:#f4ead4;font:14px system-ui}header{padding:18px;display:flex;gap:30px}a{color:inherit}canvas{width:100vw;height:78vh;display:block}p{padding:15px;max-width:900px}button,input{font:inherit}#status{white-space:pre-wrap}</style><header><a href="/">← Return to the world</a><strong>Actual QualiaPortal .10d inspection</strong></header><canvas id="native"></canvas><p><label>Orbit <input id="orbit" type="range" min="-3.14" max="3.14" step=".01" value=".6"></label> <label>Zoom <input id="zoom" type="range" min=".3" max="8" step=".1" value="2"></label></p><p id="status">Opening the checked-in QualiaPortal WASM and the Synth-produced terrain. This may take a moment.</p><script type="module">
import {loadQualiaPortal,startPortalLoop} from '/source/js/qualia-shell.js';
try{const manifest=await fetch('/data/terrain-production.json').then(r=>{if(!r.ok)throw Error('Terrain production record is unavailable');return r.json();});const canvas=document.getElementById('native');const loaded=await loadQualiaPortal(canvas,{allowWebGl2:true});const portal=loaded.portal;const bytes=new Uint8Array(await fetch(manifest.model_url).then(r=>r.arrayBuffer()));const receipt=portal.load_10d(bytes);portal.set_lighting?.(.4,.8,.3,1.5,.5);portal.set_clear_color?.(.06,.12,.1,1);portal.set_camera?.(.6,.6,2);startPortalLoop(canvas,()=>{});document.getElementById('status').textContent='QualiaPortal loaded the actual .10d. '+JSON.stringify(receipt);const set=()=>portal.set_camera?.(+document.getElementById('orbit').value,.6,+document.getElementById('zoom').value);document.getElementById('orbit').oninput=set;document.getElementById('zoom').oninput=set;window.PORTAL_REVIEW={loaded:true,receipt};}catch(e){document.getElementById('status').textContent='Native viewer could not initialise on this browser/profile: '+e.message+'. The main world and reading route remain available.';window.PORTAL_REVIEW={loaded:false,error:e.message};}
</script></html>
