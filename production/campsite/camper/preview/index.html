<!doctype html><html lang="en-AU"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Native camper review</title><style>body{margin:0;background:#1c2b28;font:14px system-ui;color:#efe5ca}header{position:absolute;z-index:2;padding:24px}canvas{display:block}button{padding:8px;background:#e6dbc1;border:0;margin:3px}small{display:block;margin-top:8px}</style><header><strong>1980-era wind-up camper · deployed</strong><small>Actual Synth loft exports · cream body, canvas upper sides, slide-out beds</small><div><button id="three">Three-quarter</button><button id="side">Side</button><button id="front">Front</button></div><small id="status">Loading native parts</small></header><script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script><script type="module">
import * as T from 'three';import {OrbitControls}from './vendor/OrbitControls.js';
const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;document.body.append(renderer.domElement);const scene=new T.Scene();scene.background=new T.Color('#74877a');scene.fog=new T.Fog('#74877a',15,40);scene.add(new T.HemisphereLight('#f9f0d3','#354537',3));const sun=new T.DirectionalLight('#fff3d8',4);sun.position.set(5,9,5);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-8,right:8,top:8,bottom:-8,near:.1,far:30});sun.shadow.bias=-.0003;scene.add(sun);const fill=new T.DirectionalLight('#b4d1e0',1);fill.position.set(-5,3,-5);scene.add(fill);
const camera=new T.PerspectiveCamera(36,innerWidth/innerHeight,.05,100);camera.position.set(7,4.5,8);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,1.3,.2);controls.enableDamping=true;controls.update();const data=await fetch('../assets/vintage-windup-camper.mesh.json').then(r=>r.json());const group=new T.Group();for(const part of data.parts){const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(part.positions,3));g.setIndex(part.indices);g.computeVertexNormals();const m=new T.Mesh(g,new T.MeshStandardMaterial({...data.palette[part.material],side:T.DoubleSide}));m.name=part.name;m.castShadow=true;m.receiveShadow=true;group.add(m)}scene.add(group);const ground=new T.Mesh(new T.PlaneGeometry(60,60),new T.MeshStandardMaterial({color:'#7d8264',roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=-.005;ground.receiveShadow=true;scene.add(ground);document.querySelector('#status').textContent=data.parts.length+' native-produced parts · inspect with drag/zoom';function view(p){camera.position.set(...p);controls.target.set(0,1.3,.2);controls.update()}document.querySelector('#three').onclick=()=>view([7,4.5,8]);document.querySelector('#side').onclick=()=>view([9,3.1,.3]);document.querySelector('#front').onclick=()=>view([.1,3.4,11]);onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)};renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});window.CAMPER_REVIEW={ready:true,parts:data.parts.length,view};
</script></html>
